# Scored by: eval/run_eval.py against the evidence the response actually cites.
#
# 1.0, raised from 0.99, and the number is arithmetic rather than ambition. The score is a
# PER-CASE grounding verdict over eleven golden requests, not a rate over individual citations,
# so a 0.99 bar passed only at eleven out of eleven: ten of eleven is 0.909. It was a 1.0 wearing
# a 0.99 label, and a reviewer reading 0.99 believed in a tolerance that did not exist.
#
# It is also what the property means. An assertion in a response pack that resolves to no
# document the orchestrator holds is a statement made to a supervisor with nothing behind it.
metric: citation_grounding
description: >
  Every assertion in the response resolves to a document the orchestrator actually holds.
threshold: 1.0
applies_to:
  - ExamResponse.items[].citations
criteria:
  - id: resolves_to_held_evidence
    description: The cited document id is one the case's corpus contains.
    weight: 1.0
denominator:
  kind: all-or-nothing
  over: golden exam requests, one grounding verdict each
direction: maximize
scoring:
  scale: [0.0, 1.0]
  pass_if: "score >= threshold"
