# Scored by: eval/run_eval.py against the due date the golden case declares.
#
# Exactly 1.0. A regulatory clock is arithmetic over a published deadline rule; a clock that is
# right most of the time is a missed statutory deadline waiting for the case it gets wrong.
metric: clock_accuracy
description: >
  The response clock the orchestrator computes equals the deadline the golden case declares.
threshold: 1.0
applies_to:
  - ExamResponse.due_at
criteria:
  - id: matches_the_declared_deadline
    description: The computed due date equals the golden expectation.
    weight: 1.0
denominator:
  kind: all-or-nothing
  over: golden exam requests
direction: maximize
scoring:
  scale: [0.0, 1.0]
  pass_if: "score >= threshold"
